<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Infinite Family Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: full-screen pannable tree canvas under a slim toolbar; person sheet slides up from the bottom (side on desktop). */
:root{
  --bg:#e9ede6; --grid:#dde3d9; --fg:#1f2a24; --muted:#5d6b62; --line:#6f7d74;
  --panel:#fbfcfa; --border:#c9d1c6; --accent:#2f6b4f; --accent-fg:#fff;
  --m-top:#dcebf7; --m-bot:#b9d6ee; --m-edge:#8fb3d3;
  --f-top:#fbe4ee; --f-bot:#f2c4d8; --f-edge:#d99ab6;
  --u-top:#eef0ec; --u-bot:#d9ddd6; --u-edge:#aab3a6;
  --focus:#e0a526; --sil:#9aa39c;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161c19; --grid:#1d2420; --fg:#e4ebe6; --muted:#9aa89f; --line:#7d8c83;
  --panel:#1f2622; --border:#334039; --accent:#6fbf96; --accent-fg:#0f1a14;
  --m-top:#294259; --m-bot:#1f3447; --m-edge:#4d7395;
  --f-top:#4f2c3c; --f-bot:#3e2230; --f-edge:#8a5470;
  --u-top:#2c332f; --u-bot:#232925; --u-edge:#4b564f;
  --focus:#f0b93d; --sil:#7d877f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161c19; --grid:#1d2420; --fg:#e4ebe6; --muted:#9aa89f; --line:#7d8c83;
  --panel:#1f2622; --border:#334039; --accent:#6fbf96; --accent-fg:#0f1a14;
  --m-top:#294259; --m-bot:#1f3447; --m-edge:#4d7395;
  --f-top:#4f2c3c; --f-bot:#3e2230; --f-edge:#8a5470;
  --u-top:#2c332f; --u-bot:#232925; --u-edge:#4b564f;
  --focus:#f0b93d; --sil:#7d877f; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--border);position:relative;z-index:5}
h1{font-family:var(--font-display);font-size:1.15rem;margin:0;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.meta{font-size:12px;color:var(--muted);white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.search{position:relative;flex:1 1 180px;min-width:0;max-width:280px}
.search input{width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.results{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;max-height:50vh;overflow:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.results button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--bg)}
.results small{color:var(--muted)}
label.gen{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
select,.btn{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer}
.btn:focus-visible,select:focus-visible,.person:focus-visible,.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#scroller{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px}
#sizer{position:relative}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage svg{position:absolute;left:0;top:0;overflow:visible}
#stage path{fill:none;stroke:var(--line);stroke-width:1.4}
.person{position:absolute;box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:6px 8px 6px 6px;border:1px solid var(--u-edge);border-radius:4px;background:linear-gradient(var(--u-top),var(--u-bot));color:var(--fg);font:inherit;text-align:left;cursor:pointer;overflow:hidden}
.person.M{border-color:var(--m-edge);background:linear-gradient(var(--m-top),var(--m-bot))}
.person.F{border-color:var(--f-edge);background:linear-gradient(var(--f-top),var(--f-bot))}
.person.focus{box-shadow:0 0 0 3px var(--focus)}
.person.sel{outline:2px solid var(--accent);outline-offset:2px}
.person .ph{flex:0 0 38px;height:46px;border-radius:2px;background:var(--bg);display:grid;place-items:center;position:relative;overflow:hidden}
.person .ph svg{width:30px;height:38px;fill:var(--sil)}
.person .ph img{width:100%;height:100%;object-fit:cover;display:block}
.person.dec .ph::before{z-index:1}
#sheet .avatar{float:right;width:72px;height:88px;object-fit:cover;border-radius:6px;margin:34px 0 8px 12px;border:1px solid var(--border)}
.person.dec .ph::before{content:"";position:absolute;left:-9px;top:4px;width:30px;height:6px;background:var(--fg);transform:rotate(-45deg);opacity:.85}
.person .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.person .nm{font-size:13px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.person .yr{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.more{position:absolute;font-size:10px;line-height:1;padding:3px 6px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-weight:600;pointer-events:none}
.zoom{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:6}
.zoom .btn{width:40px;height:40px;font-size:18px;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.12)}
#sheet{position:fixed;z-index:15;background:var(--panel);border:1px solid var(--border);box-shadow:0 -8px 30px rgba(0,0,0,.18);overflow:auto;left:0;right:0;bottom:0;max-height:62vh;border-radius:14px 14px 0 0;padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){#sheet{left:auto;top:64px;bottom:16px;right:16px;width:340px;max-height:none;border-radius:12px;padding:16px}}
#sheet h2{font-family:var(--font-display);font-size:1.3rem;margin:0 32px 2px 0;text-wrap:balance;font-weight:600}
#sheet .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
#sheet dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 12px;font-size:14px}
#sheet dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
#sheet dd{margin:0;min-width:0}
#sheet .rel{display:flex;flex-wrap:wrap;gap:6px}
#sheet .rel button{font:inherit;font-size:13px;padding:4px 8px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--fg);cursor:pointer}
#sheet .note{font-size:13px;line-height:1.5;color:var(--fg);white-space:pre-wrap;border-top:1px solid var(--border);padding-top:10px;margin-top:6px}
#sheet .close{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%}
#sheet .primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;padding:8px 12px;margin-bottom:12px}
#sheet .acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#sheet .acts .primary{margin-bottom:0}
.form{display:flex;flex-direction:column;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form input,.form select,.form textarea,#ex-text{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box;min-width:0}
#sheet h3.sect{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px;font-weight:600}
.exist{position:relative}
.dup{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.dup small{color:var(--muted)}
.dup .acts{margin:4px 0 0}
#ed-chosen{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--fg)}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.relrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
.fh{font-size:11px;color:var(--muted);font-weight:400;line-height:1.3}
.btn.danger{color:#b3261e;border-color:#b3261e;background:none}
.files{border-top:1px solid var(--border);margin-top:10px;padding-top:10px}
.files h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:8px}
.thumb{display:flex;flex-direction:column;gap:4px;padding:0;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer;overflow:hidden;text-align:left}
.thumb img,.thumb .doc{width:100%;aspect-ratio:1;object-fit:cover;display:block;max-width:100%}
.thumb .doc{display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);background:var(--panel)}
.thumb span.cap{font-size:11px;padding:0 6px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .clip{position:absolute;right:6px;bottom:5px;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:2px}
.person .clip svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2}
#lb{position:fixed;inset:0;z-index:30;background:rgba(10,14,12,.92);display:flex;flex-direction:column;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
#lb .view{flex:1;min-height:0;display:grid;place-items:center;overflow:auto}
#lb img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
#lb .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#eef2ef}
#lb .bar input{flex:1 1 160px;min-width:0;font:inherit;font-size:15px;padding:7px 9px;border-radius:8px;border:1px solid #55605a;background:#1c2320;color:#eef2ef}
#lb .btn{background:#1c2320;color:#eef2ef;border-color:#55605a}
#lb a.btn{text-decoration:none}
#lb .btn.danger{color:#ff8a80;border-color:#ff8a80}
@media (prefers-reduced-motion:no-preference){.person{transition:box-shadow .15s}}

/* list + stats overlay */
#views{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column}
#views[hidden]{display:none}
#views .vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--border);background:var(--panel)}
#views .tabs{display:flex;gap:4px}
#views .tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#views select,#views input{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
#views .vbody{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 40px}
#views .vclose{margin-left:auto}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable th{position:sticky;top:-12px;background:var(--bg);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
.ptable td{padding:8px 6px;border-bottom:1px solid var(--grid);vertical-align:top}
.ptable tr[data-id]{cursor:pointer}.ptable tr[data-id]:hover td{background:var(--panel)}
.ptable .sx{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ptable small{color:var(--muted)}
@media (max-width:640px){.ptable .hide-s{display:none}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-size:24px;font-weight:600;margin-top:2px}.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:8px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.chart{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
.chart h3{margin:0 0 10px;font-size:14px}
.hbar{display:grid;grid-template-columns:minmax(80px,38%) 1fr 34px;gap:6px;align-items:center;font-size:13px;margin:4px 0}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hbar .n{text-align:right;color:var(--muted)}
.hbar .b{height:12px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.cols{display:flex;align-items:flex-end;gap:2px;height:140px;border-bottom:1px solid var(--border)}
.cols .c{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:1px;position:relative}
.cols .c:hover{opacity:.8}
.colx{display:flex;gap:2px;font-size:11px;color:var(--muted);margin-top:4px}.colx span{flex:1;min-width:0;white-space:nowrap;overflow:visible}
.vnote{color:var(--muted);font-size:12px;margin:14px 0 0}

.rl-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;max-width:760px}
.rl-pick .exist{position:relative}.rl-pick label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.rl-pick .results{position:absolute;left:0;right:0;top:100%;z-index:3;background:var(--panel);border:1px solid var(--border);border-radius:8px;max-height:260px;overflow:auto}
.rl-pick .results button{display:block;width:100%;text-align:left;padding:8px;border:0;border-bottom:1px solid var(--grid);background:none;color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.rl-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;max-width:760px}
.rl-card h3{margin:0 0 4px;font-family:var(--font-display);font-size:19px}
.rl-card .why{font-size:13px;color:var(--muted);margin:0 0 10px}
.rl-tree{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.rl-top{grid-column:1/-1;justify-self:center;text-align:center}
.rl-col{display:flex;flex-direction:column;align-items:center;gap:0}
.rl-chip{all:unset;cursor:pointer;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;text-align:center;max-width:100%}
.rl-chip.end{border:2px solid var(--accent);font-weight:600}
.rl-chip small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.rl-arrow{color:var(--muted);font-size:12px;line-height:1;padding:3px 0}
.rl-steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
@media (max-width:600px){.rl-pick{grid-template-columns:1fr}}
.lc-wrap{max-width:1000px;margin:0 auto}
.lc-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.lc-row{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,.8fr);gap:12px;align-items:center}
.lc-gen{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.lc-card{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:12px 14px}
.lc-card.me{background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.lc-card h4{margin:0 0 6px;font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.25}
.lc-card h4 button{all:unset;cursor:pointer}.lc-card h4 button:hover{text-decoration:underline}
.lc-card h4 .plus{color:var(--muted);font-weight:400;margin:0 6px}
.lc-card p{margin:2px 0;font-size:13px;color:var(--muted)}
.lc-rem{border-left:2px dashed var(--border);padding-left:12px;font-size:13px;color:var(--muted)}
.lc-rem p{margin:2px 0}.lc-rem strong{color:var(--fg);font-weight:600}
.lc-link{height:22px;margin-left:calc(34px + 12px);width:calc((100% - 46px) * .555);display:flex;justify-content:center}
.lc-link span{width:2px;background:var(--accent)}
@media (max-width:700px){.lc-row{grid-template-columns:26px 1fr}.lc-rem{grid-column:2;margin-top:-4px;margin-bottom:4px}.lc-link{width:calc(100% - 38px);margin-left:38px}}
@media print{header,#views .vbar,.zoom,#sheet,.lc-ctl{display:none!important}#views{position:static}#views .vbody{overflow:visible}}

</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;font-size:14px}
img{max-width:100%}
#auth{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.12);box-sizing:border-box}
.card h1{font-family:var(--font-display);font-size:1.6rem;margin:0 0 4px;font-weight:600}
.card .lede{color:var(--muted);margin:0 0 18px;line-height:1.5}
.card form{display:flex;flex-direction:column;gap:12px}
.card label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.card input,.card select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg)}
.card .go{font:inherit;font-weight:600;font-size:15px;padding:11px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.card .links{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:13px;flex-wrap:wrap}
.card .links button{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0}
.card .msg{font-size:13px;min-height:1em;color:var(--muted)}
.card .msg.err{color:#c0392b}
#members{position:fixed;inset:0;z-index:35;background:rgba(10,14,12,.45);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#members .card{max-width:560px;max-height:80vh;overflow:auto}
.mrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.mrow .who{min-width:0;overflow-wrap:anywhere}
.mrow small{color:var(--muted);display:block}
.creds{white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;user-select:all}
.plink{grid-column:1/-1}.plink small{display:inline}.lnk{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;padding:0 4px;cursor:pointer;text-decoration:underline}
.psearch input{width:100%;margin-top:6px}.pres button{display:block;width:100%;text-align:left;padding:8px;border:0;border-bottom:1px solid var(--border);background:none;color:inherit;font:inherit;cursor:pointer}
.mrow select{font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg)}
.mrow.pending{background:color-mix(in srgb,var(--focus) 12%,transparent)}
@media (min-width:760px){#sheet{top:118px}}
.userchip{font-size:12px;color:var(--muted);white-space:nowrap}
</style>

<body>
<header>
  <h1>Infinite Family Tree</h1>
  <span class="meta" id="meta"></span>
  <div class="tools">
    <div class="search">
      <input id="q" type="search" placeholder="Find a person…" autocomplete="off" aria-label="Find a person">
      <div class="results" id="results" hidden></div>
    </div>
    <label class="gen">Up <select id="up"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>8</option></select></label>
    <label class="gen">Down <select id="down"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
    <button class="btn" id="home" type="button">Home</button>
    <button class="btn" id="views-open" type="button">List, stats &amp; birthdays</button>
    <button class="btn" id="export" type="button">GEDCOM</button>
    <span class="meta" id="savestate" aria-live="polite"></span>
  </div>
</header>
<div id="scroller"><div id="sizer"><div id="stage"><svg id="lines"></svg></div></div></div>
<div class="zoom"><button class="btn" id="zin" type="button" aria-label="Zoom in">+</button><button class="btn" id="zout" type="button" aria-label="Zoom out">−</button></div>
<aside id="sheet" hidden></aside>
<div id="views" hidden role="dialog" aria-label="List and stats"></div>
<div id="lb" hidden role="dialog" aria-label="Attachment"></div>
<input type="file" id="filepick" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="gedpick" accept=".ged,.txt,text/plain" hidden>

<script type="text/plain" id="treecode">
const DATA = window.__DATA;
(function(){
const W=168,H=64,GX=14,GY=60;
const P={},F={};
const CLIP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 7"/></svg>';
const SIL='<svg viewBox="0 0 30 38" aria-hidden="true"><circle cx="15" cy="11" r="8"/><path d="M1 38c0-9 6-15 14-15s14 6 14 15z"/></svg>';

// ---------- GEDCOM ----------
function parseGed(text,pfx,label,PP,FF){PP=PP||P;FF=FF||F;
  let cur=null,l1=null;
  for(const raw of text.split(/\r?\n/)){
    const m=raw.match(/^\s*(\d+)\s+(@[^@]+@\s+)?(\S+)(?:\s(.*))?$/); if(!m)continue;
    const lv=+m[1],xref=m[2]&&m[2].trim(),tag=m[3],val=(m[4]||'').trim();
    if(lv===0){l1=null;cur=null;
      if(xref&&tag==='INDI'){cur=PP[pfx+xref]={id:pfx+xref,name:'',sex:'U',ev:{},famc:[],fams:[],notes:[],src:label,t:'I'}}
      else if(xref&&tag==='FAM'){cur=FF[pfx+xref]={id:pfx+xref,husb:null,wife:null,chil:[],ev:{},t:'F'}}
      continue}
    if(!cur)continue;
    if(lv===1){l1=tag;
      if(cur.t==='I'){
        if(tag==='NAME'){cur.nameN=(cur.nameN||0)+1;if(!cur.name)cur.name=val;else cur.altName=val}
        else if(tag==='SEX')cur.sex=(val[0]||'U').toUpperCase();
        else if(tag==='FAMC')cur.famc.push(pfx+val);
        else if(tag==='FAMS')cur.fams.push(pfx+val);
        else if(tag==='NOTE')cur.notes.push(val);
        else if(tag==='_TREEID')cur.treeId=val;
        else if(tag==='_MATCH')cur.matchNames=val.split('|').map(x=>x.trim()).filter(Boolean);
        else if(tag==='_RENAME')cur.rename=true;
        else if(/^(BIRT|CHR|BAPM|DEAT|BURI)$/.test(tag))cur.ev[tag]=cur.ev[tag]||{};
      }else{
        if(tag==='HUSB')cur.husb=pfx+val;
        else if(tag==='WIFE')cur.wife=pfx+val;
        else if(tag==='CHIL')cur.chil.push(pfx+val);
        else if(tag==='MARR')cur.ev.MARR=cur.ev.MARR||{};
      }
    }else if(lv===2){
      if((tag==='CONT'||tag==='CONC')&&l1==='NOTE'&&cur.notes.length){cur.notes[cur.notes.length-1]+=(tag==='CONT'?'\n':'')+val}
      else if(cur.ev[l1]&&(tag==='DATE'||tag==='PLAC'))cur.ev[l1][tag==='PLAC'?'place':'date']=val;
      else if(l1==='NAME'&&tag==='GIVN'&&!cur.given)cur.given=val;
      else if(l1==='NAME'&&tag==='NICK'&&!cur.nick)cur.nick=val;
      else if(l1==='NAME'&&tag==='TYPE'&&/birth|maiden/i.test(val)&&cur.nameN>1&&cur.altName&&!cur.maiden)cur.maiden=(cur.altName.match(/\/([^/]*)\//)||[])[1]||'';
    }
  }
}
function niceName(n){return (n||'Unknown').replace(/\//g,'').replace(/\s+/g,' ').trim()||'Unknown'}
function year(d){if(!d)return'';const y=(d.match(/\d{4}/)||[''])[0];if(!y)return'';return(/^(ABT|EST|CAL|BEF|AFT)/i.test(d)?'c.':'')+y}
function birthOf(p){return p.ev.BIRT||p.ev.CHR||p.ev.BAPM||{}}
function deathOf(p){return p.ev.DEAT||p.ev.BURI||{}}
function years(p){const b=year(birthOf(p).date),d=year(deathOf(p).date);if(!b&&!d)return'';return (b||'?')+' – '+(d||(isDead(p)?'?':''))}
function isDead(p){if(p.ev.DEAT||p.ev.BURI)return true;const y=+((birthOf(p).date||'').match(/\d{4}/)||[0])[0];return y&&y<1926}
function fmtDate(d){if(!d)return'';return d.replace(/\bABT\b/i,'about').replace(/\bBEF\b/i,'before').replace(/\bAFT\b/i,'after').replace(/\bEST\b/i,'est.').replace(/\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\b/g,m=>m[0]+m.slice(1).toLowerCase())}

// load base data (research GEDCOMs), then apply edits saved from this page
(DATA&&DATA.sources||[]).forEach(s=>parseGed(s.ged,s.prefix+':',s.label));
(DATA&&DATA.links||[]).forEach((l,i)=>{
  const find=n=>Object.values(P).find(p=>niceName(p.name).toLowerCase()===n.toLowerCase());
  const h=find(l.husb),w=find(l.wife);if(!h||!w)return;
  const id='L:@F'+i+'@';F[id]={id,husb:h.id,wife:w.id,chil:[],ev:l.date?{MARR:{date:l.date}}:{},t:'F'};
});
const BASE_P=JSON.parse(JSON.stringify(P)),BASE_F=JSON.parse(JSON.stringify(F));
let OV_P={},OV_F={};
function rebuild(){
  for(const k in P)delete P[k];for(const k in F)delete F[k];
  const bp=JSON.parse(JSON.stringify(BASE_P)),bf=JSON.parse(JSON.stringify(BASE_F));Object.assign(P,bp);Object.assign(F,bf);
  for(const id in OV_F){const o=OV_F[id];if(o.deleted){delete F[id];continue}
    F[id]={id,husb:o.husb||null,wife:o.wife||null,chil:(o.chil||[]).slice(),ev:(o.marrDate||o.marrPlace)?{MARR:{date:o.marrDate||'',place:o.marrPlace||''}}:{},t:'F'}}
  for(const id in OV_P){const o=OV_P[id];if(o.deleted){delete P[id];continue}
    const p=P[id]||(P[id]={id,ev:{},notes:[],src:'Added in this tool',t:'I'});
    p.name=o.name||'';p.sex=o.sex||'U';p.edited=true;
    [['BIRT','birth'],['DEAT','death']].forEach(([t,k])=>{const d=o[k+'Date']||'',pl=o[k+'Place']||'';if(d||pl)p.ev[t]={date:d,place:pl};else delete p.ev[t]});
    p.notes=o.note?[o.note]:[];p.middle=o.middle;p.maiden=o.maiden||'';p.nick=o.nick||''}
  for(const id in P){P[id].famc=[];P[id].fams=[]}
  // the same child listed twice (in one family, or in two families of the same parents) is drawn once, under the fuller family
  Object.values(F).forEach(f=>{f.chil=[...new Set(f.chil)]});
  {const byChild={};Object.values(F).forEach(f=>f.chil.forEach(c=>(byChild[c]=byChild[c]||[]).push(f)));
   for(const c in byChild){const fs=byChild[c];if(fs.length<2)continue;
     fs.forEach(a=>{const pa=[a.husb,a.wife].filter(Boolean);if(fs.some(b=>{if(a===b||!b.chil.includes(c))return false;const pb=[b.husb,b.wife].filter(Boolean);
       return pa.every(x=>pb.includes(x))&&(pa.length<pb.length||a.id>b.id)}))a.chil=a.chil.filter(x=>x!==c)})}}
  Object.values(F).forEach(f=>{if(f.husb&&!P[f.husb])f.husb=null;if(f.wife&&!P[f.wife])f.wife=null;f.chil=f.chil.filter(c=>P[c]);
    [f.husb,f.wife].forEach(x=>x&&P[x].fams.push(f.id));f.chil.forEach(c=>P[c].famc.push(f.id))});
  const n=Object.keys(OV_P).length+Object.keys(OV_F).length;
  document.getElementById('meta').textContent=Object.keys(P).length+' people'+(DATA&&DATA.built?' · research '+DATA.built:'')+(n?' · '+n+' edits':'');
}
rebuild();

const parentsOf=id=>{const p=P[id];if(!p)return null;const f=p.famc.map(x=>F[x]).find(Boolean);return f&&(f.husb||f.wife)?f:null};
const famsOf=id=>(P[id]?P[id].fams:[]).map(x=>F[x]).filter(Boolean);
const spouseIn=(f,id)=>f.husb===id?f.wife:f.husb;
const sortKids=ch=>ch.slice();

// ---------- layout ----------
let boxes=[],paths=[],UP=3,DOWN=2;
const rowY=r=>r*(H+GY);
function box(pid,x,r){boxes.push({pid,x,y:rowY(r)});return{x,cx:x+W/2,top:rowY(r),bot:rowY(r)+H}}
function bracket(a,b,k){const y=a.bot+8+k*6;paths.push(`M${a.cx} ${a.bot}V${y}H${b.cx}V${b.bot}`);return{x:(a.cx+b.cx)/2,y}}
function drop(anchor,kids){if(!kids.length)return;const top=kids[0].top,my=top-20;const xs=kids.map(k=>k.cx).concat(anchor.x);
  let d=`M${anchor.x} ${anchor.y}V${my}M${Math.min(...xs)} ${my}H${Math.max(...xs)}`;kids.forEach(k=>d+=`M${k.cx} ${my}V${top}`);paths.push(d)}

const mDesc=new Map();
function measureDesc(pid,gen,max){const key=pid+'|'+gen+'|'+max;if(mDesc.has(key))return mDesc.get(key);
  const fams=famsOf(pid),ns=fams.filter(f=>spouseIn(f,pid)).length,unit=W+ns*(W+GX);let cw=0,n=0;
  if(gen<max)fams.forEach(f=>f.chil.forEach(c=>{cw+=measureDesc(c,gen+1,max);n++}));
  const w=Math.max(unit,cw+Math.max(0,n-1)*GX);mDesc.set(key,w);return w}
function placeDesc(pid,gen,max,x0,r){
  const B=measureDesc(pid,gen,max),fams=famsOf(pid),ns=fams.filter(f=>spouseIn(f,pid)).length,unit=W+ns*(W+GX);
  const me=box(pid,x0+(B-unit)/2,r);let sx=me.x+W+GX,k=0;const anchors=[];
  fams.forEach(f=>{const s=spouseIn(f,pid);if(s){const sb=box(s,sx,r);sx+=W+GX;anchors.push(bracket(me,sb,k++))}else anchors.push({x:me.cx,y:me.bot})});
  if(gen<max){let n=0,cw=0;fams.forEach(f=>f.chil.forEach(c=>{cw+=measureDesc(c,gen+1,max);n++}));cw+=Math.max(0,n-1)*GX;
    let cx=x0+(B-cw)/2;fams.forEach((f,i)=>{const kids=[];f.chil.forEach(c=>{const w=measureDesc(c,gen+1,max);kids.push(placeDesc(c,gen+1,max,cx,r+1));cx+=w+GX});drop(anchors[i],kids)})}
  return me}

const mPed=new Map();
function pedW(pid,depth){if(!pid)return 0;const key=pid+'|'+depth;if(mPed.has(key))return mPed.get(key);
  const f=parentsOf(pid);let w=W;if(f&&depth<UP){w=Math.max(W,coupleW(f,depth+1))}mPed.set(key,w);return w}
function coupleW(f,depth){const a=pedW(f.husb,depth),b=pedW(f.wife,depth);return a+b+(a&&b?GX:0)}
function placePerson(pid,depth,x0,side){const w=pedW(pid,depth);const me=box(pid,side==='L'?x0+w-W:x0,-depth);
  const f=parentsOf(pid);if(f&&depth<UP){const cw=coupleW(f,depth+1);const a=placeCouple(f,depth+1,x0+(w-cw)/2);drop(a,[me])}return me}
function placeCouple(f,depth,x0){let a=null,b=null;
  if(f.husb)a=placePerson(f.husb,depth,x0,'L');
  if(f.wife)b=placePerson(f.wife,depth,x0+(f.husb?pedW(f.husb,depth)+GX:0),'R');
  if(a&&b)return bracket(a,b,0);const o=a||b;return{x:o.cx,y:o.bot}}
// parent row (row -1) with that parent's own siblings
function parentRegion(pid){const gp=UP>=2?parentsOf(pid):null;const sibs=gp?gp.chil.filter(c=>c!==pid):[];
  const n=sibs.length+1,rw=n*W+(n-1)*GX,cw=gp?coupleW(gp,2):0;return{gp,sibs,rw,cw,w:Math.max(rw,cw)}}
function placeParent(pid,x0,side){const R=parentRegion(pid);const list=side==='L'?R.sibs.concat(pid):[pid].concat(R.sibs);
  const rx=side==='L'?x0+R.w-R.rw:x0;let me=null;const kids=list.map((c,i)=>{const b=box(c,rx+i*(W+GX),-1);if(c===pid)me=b;return b});
  if(R.gp){const center=rx+R.rw/2;let gx=center-R.cw/2;gx=Math.max(x0,Math.min(gx,x0+R.w-R.cw));const a=placeCouple(R.gp,2,gx);
    drop(a,kids.slice().sort((p,q)=>p.cx-q.cx))}
  return me}

function layout(focus){
  boxes=[];paths=[];mDesc.clear();mPed.clear();
  const pf=UP>=1?parentsOf(focus):null;
  if(!pf){placeDesc(focus,0,DOWN,0,0);return}
  let anchor,x=0,a=null,b=null;
  if(pf.husb){const R=parentRegion(pf.husb);a=placeParent(pf.husb,0,'L');x=R.w+GX}
  if(pf.wife){b=placeParent(pf.wife,x,'R')}
  anchor=a&&b?bracket(a,b,0):{x:(a||b).cx,y:(a||b).bot};
  const sibs=pf.chil.length?pf.chil:[focus];
  const SD=Math.min(DOWN,1); // brothers and sisters also show their children (nieces and nephews)
  const ws=sibs.map(s=>measureDesc(s,0,s===focus?DOWN:SD));const tw=ws.reduce((s,w)=>s+w,0)+(sibs.length-1)*GX;
  let cx=anchor.x-tw/2;const kids=[];
  sibs.forEach((s,i)=>{kids.push(placeDesc(s,0,s===focus?DOWN:SD,cx,0));cx+=ws[i]+GX});
  drop(anchor,kids);
}

// ---------- render ----------
const stage=document.getElementById('stage'),svg=document.getElementById('lines'),sizer=document.getElementById('sizer'),scroller=document.getElementById('scroller');
let focusId=null,selId=null,scale=1,dims={w:0,h:0},fbox=null;
const PAD=60;
function render(keepView){
  if(!P[focusId]){const f=homeId();if(!f){stage.querySelectorAll('.person,.more').forEach(e=>e.remove());svg.innerHTML='';return}focusId=f}
  layout(focusId);
  const minX=Math.min(...boxes.map(b=>b.x)),minY=Math.min(...boxes.map(b=>b.y));
  const maxX=Math.max(...boxes.map(b=>b.x+W)),maxY=Math.max(...boxes.map(b=>b.y+H));
  const ox=PAD-minX,oy=PAD-minY;dims={w:maxX-minX+PAD*2,h:maxY-minY+PAD*2};
  stage.querySelectorAll('.person,.more').forEach(e=>e.remove());
  svg.setAttribute('width',dims.w);svg.setAttribute('height',dims.h);
  svg.innerHTML=`<g transform="translate(${ox} ${oy})">`+paths.map(d=>`<path d="${d}"/>`).join('')+'</g>';
  const shown=new Set(boxes.map(b=>b.pid));const frag=document.createDocumentFragment();fbox=null;
  boxes.forEach(b=>{const p=P[b.pid];const el=document.createElement('button');el.type='button';
    el.className='person '+(p.sex==='M'||p.sex==='F'?p.sex:'U')+(isDead(p)?' dec':'')+(b.pid===focusId?' focus':'')+(b.pid===selId?' sel':'');
    el.style.cssText=`left:${b.x+ox}px;top:${b.y+oy}px;width:${W}px;height:${H}px`;el.dataset.id=b.pid;
    const pic=profileOf(b.pid);el.innerHTML=`<span class="ph">${pic?`<img src="${esc(pic.url)}" alt="" loading="lazy">`:SIL}</span><span class="tx"><span class="nm"></span><span class="yr"></span></span>`;
    el.querySelector('.nm').textContent=plateName(p);el.querySelector('.yr').textContent=years(p);
    const nf=mediaOf(b.pid).length;if(nf){const c=document.createElement('span');c.className='clip';c.innerHTML=CLIP+nf;c.title=nf+' attached file'+(nf>1?'s':'');el.appendChild(c)}
    frag.appendChild(el);if(b.pid===focusId&&!fbox)fbox={x:b.x+ox,y:b.y+oy};
    const pf=parentsOf(b.pid);const hidUp=pf&&![pf.husb,pf.wife].some(x=>x&&shown.has(x));
    const kids=famsOf(b.pid).flatMap(f=>f.chil);const hidDn=kids.length&&!kids.some(c=>shown.has(c));
    if(hidUp){const m=document.createElement('span');m.className='more';m.textContent="▲ more";m.style.cssText=`left:${b.x+ox+W/2-24}px;top:${b.y+oy-18}px`;frag.appendChild(m)}
    if(hidDn){const m=document.createElement('span');m.className='more';m.textContent='▼ '+kids.length;m.style.cssText=`left:${b.x+ox+W/2-16}px;top:${b.y+oy+H+3}px`;frag.appendChild(m)}
  });
  stage.appendChild(frag);applyScale();
  if(!keepView&&fbox)centerOn(fbox);
}
function applyScale(){stage.style.transform=`scale(${scale})`;sizer.style.width=dims.w*scale+'px';sizer.style.height=dims.h*scale+'px'}
function centerOn(b){scroller.scrollLeft=(b.x+W/2)*scale-scroller.clientWidth/2;scroller.scrollTop=(b.y+H/2)*scale-scroller.clientHeight/2}
function zoomTo(s,cx,cy){s=Math.max(.3,Math.min(2,s));if(cx==null){cx=scroller.clientWidth/2;cy=scroller.clientHeight/2}
  const wx=(scroller.scrollLeft+cx)/scale,wy=(scroller.scrollTop+cy)/scale;scale=s;applyScale();scroller.scrollLeft=wx*scale-cx;scroller.scrollTop=wy*scale-cy;
  try{localStorage.setItem('ft-zoom',String(scale))}catch(e){}}

// ---------- person sheet ----------
const sheet=document.getElementById('sheet');
function chip(id){const p=P[id];return p?`<button type="button" data-go="${id}">${esc(plateName(p))}</button>`:''}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function evRow(label,e){if(!e||(!e.date&&!e.place))return'';return`<dt>${label}</dt><dd>${esc(fmtDate(e.date||''))}${e.date&&e.place?'<br>':''}<span style="color:var(--muted)">${esc(e.place||'')}</span></dd>`}
function openSheet(id){selId=id;const p=P[id];
  document.querySelectorAll('.person.sel').forEach(e=>e.classList.remove('sel'));document.querySelectorAll(`.person[data-id="${CSS.escape(id)}"]`).forEach(e=>e.classList.add('sel'));
  const pf=parentsOf(id),par=pf?[pf.husb,pf.wife].filter(Boolean):[];
  const sibs=pf?pf.chil.filter(c=>c!==id):[];
  const fams=famsOf(id);const sps=fams.map(f=>spouseIn(f,id)).filter(Boolean);const kids=fams.flatMap(f=>f.chil);
  const marr=fams.map(f=>f.ev.MARR&&(f.ev.MARR.date||f.ev.MARR.place)?`${esc(fmtDate(f.ev.MARR.date||''))} ${f.ev.MARR.place?'· '+esc(f.ev.MARR.place):''}${spouseIn(f,id)?' ('+esc(niceName(P[spouseIn(f,id)].name))+')':''}`:'').filter(Boolean);
  sheet.innerHTML=`<button class="btn close" type="button" aria-label="Close" data-close>✕</button>
   ${profileOf(id)?`<img class="avatar" src="${esc(profileOf(id).url)}" alt="" data-media="${esc(profileOf(id).key)}">`:''}<h2>${esc(plateName(p))}</h2>${p.nick||p.maiden?`<div class="sub">${[p.nick?'“'+esc(p.nick)+'”':'',p.maiden?(()=>{const n=nameParts(p);return 'Born '+esc(niceName(`${n.given} ${n.middle} ${p.maiden}`))})():''].filter(Boolean).join(' · ')}</div>`:''}<div class="sub">${p.sex==='M'?'Male':p.sex==='F'?'Female':''}${years(p)?' · '+years(p):''} · ${esc(p.src)}${p.edited?' · edited':''}</div>
   <div class="acts">${id!==focusId?`<button class="btn primary" type="button" data-focus="${id}">Show tree from here</button>`:''}
   ${canEditP(id)?`<button class="btn" type="button" data-edit="${id}">Edit</button>
   <select class="btn" data-add="${id}" aria-label="Add a relative"><option value="">Add…</option><option value="father">Father</option><option value="mother">Mother</option><option value="spouse">Spouse</option><option value="child">Child</option><option value="sibling">Brother or sister</option></select>`:''}${window.__adminTools&&(!window.__adminTools.limited||canEditP(id))?`<button class="btn" type="button" data-acct="${id}">Create account</button>`:''}</div>
   <dl>${evRow('Born',p.ev.BIRT)}${evRow('Baptized',p.ev.CHR||p.ev.BAPM)}${evRow('Died',p.ev.DEAT)}${evRow('Buried',p.ev.BURI)}
   ${marr.length?`<dt>Married</dt><dd>${marr.join('<br>')}</dd>`:''}
   ${par.length?`<dt>Parents</dt><dd class="rel">${par.map(chip).join('')}</dd>`:''}
   ${sps.length?`<dt>Spouse</dt><dd class="rel">${sps.map(chip).join('')}</dd>`:''}
   ${sibs.length?`<dt>Siblings</dt><dd class="rel">${sibs.map(chip).join('')}</dd>`:''}
   ${kids.length?`<dt>Children</dt><dd class="rel">${kids.map(chip).join('')}</dd>`:''}</dl>
   ${p.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}
   ${filesSection(id)}`;
  sheet.hidden=false;sheet.scrollTop=0}
sheet.addEventListener('click',e=>{const t=e.target.closest('button,img[data-media]');if(!t)return;
  if(t.dataset.close!=null){sheet.hidden=true;selId=null;document.querySelectorAll('.person.sel').forEach(e=>e.classList.remove('sel'));return}
  if(t.dataset.focus){setFocus(t.dataset.focus);return}

function readForm(){const v=i=>document.getElementById(i).value.trim();

function famData(f){return{id:f.id,husb:f.husb||null,wife:f.wife||null,chil:f.chil.slice(),marrDate:(f.ev.MARR||{}).date||'',marrPlace:(f.ev.MARR||{}).place||''}}
const writes=[];
function queue(coll,id,data){OV_P;(coll==='people'?OV_P:OV_F)[id]=data;writes.push([coll,id,data])}
async function flush(){status('Saving…');{const last={};writes.forEach((w,i)=>last[w[0]+'|'+w[1]]=i);const keep=writes.filter((w,i)=>last[w[0]+'|'+w[1]]===i);writes.length=0;writes.push(...keep)}
  try{if(db.bulk&&writes.length>3){const now=new Date().toISOString();await db.bulk(writes.splice(0).map(([c,id,data])=>({coll:c,id:keyOf(id),data:Object.assign({},data,{id,updatedAt:now})})))}
  while(writes.length){const[c,id,data]=writes.shift();await db.collection(c).doc(keyOf(id)).set(Object.assign({},data,{id,updatedAt:new Date().toISOString()}))}status('Saved')}
  catch(e){status('Not saved: '+(e&&e.code==='not_granted'?'you can view but not edit this tree':(e&&e.message)||'error'),true)}}
function submitForm(o){if(!canEditP(o.mode==='edit'?o.id:o.anchor)){status('Another family admin manages this person',true);return}const data=o.existing?null:readForm();if(data&&!data.name.replace(/[\s/]/g,'')){status('Add a name first',true);return}
  let pid=o.id;

      const already=(o.rel==='spouse'&&famsOf(a).some(f=>spouseIn(f,a)===pid))||(o.rel==='child'&&famsOf(a).some(f=>f.chil.includes(pid)))||((o.rel==='father'||o.rel==='mother'||o.rel==='sibling')&&parentsOf(a)&&[parentsOf(a).husb,parentsOf(a).wife].concat(parentsOf(a).chil).includes(pid));
      if(already){status('They are already linked',true);return}}
    else{pid='N:@I'+uid()+'@';if(limited())window.__PERM.editable.add(pid);queue('people',pid,data)}
    const psex=data?data.sex:P[pid].sex;
    const newFam=()=>({id:'N:@F'+uid()+'@',husb:null,wife:null,chil:[],ev:{}});
    if(o.rel==='father'||o.rel==='mother'){let f=parentsOf(a);f=f?JSON.parse(JSON.stringify(f)):Object.assign(newFam(),{chil:[a]});f[o.rel==='father'?'husb':'wife']=pid;queue('families',f.id,famData(f))}
    else if(o.rel==='spouse'){const f=newFam();const meHusb=as==='M'||(as!=='F'&&psex!=='M');f.husb=meHusb?a:pid;f.wife=meHusb?pid:a;queue('families',f.id,famData(f))}
    else if(o.rel==='child'){const sel=document.getElementById('ed-fam').value;let f=sel!=='new'&&F[sel]?JSON.parse(JSON.stringify(F[sel])):Object.assign(newFam(),as==='F'?{wife:a}:{husb:a});f.chil.push(pid);queue('families',f.id,famData(f))}
    else if(o.rel==='sibling'){let f=parentsOf(a);f=f?JSON.parse(JSON.stringify(f)):Object.assign(newFam(),{chil:[a]});f.chil.push(pid);queue('families',f.id,famData(f))}
  }
  rebuild();render(true);openSheet(pid);flush()}

function relSection(id){const p=P[id];if(!p)return'';const nm=x=>esc(plateName(P[x]));const rows=[];
  p.famc.forEach(fid=>{const f=F[fid];if(!f)return;const ps=[f.husb,f.wife].filter(Boolean);rows.push([`Child of ${ps.length?ps.map(nm).join(' & '):'unknown parents'}`,`c|${fid}|${id}`])});

function unlink(kind,fid,pid,self){const f0=F[fid];if(!f0)return;const f=JSON.parse(JSON.stringify(f0));
  if(kind==='s'){if(f.husb===pid)f.husb=null;else if(f.wife===pid)f.wife=null}else f.chil=f.chil.filter(x=>x!==pid);

async function shrink(file){ // keep phone photos small enough to load fast; documents stay readable at 2400px
  if(!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)||file.size<2.5e6)return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,2400/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return b||file}catch(e){return file}}
document.getElementById('filepick').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';const pid=pickFor;if(!files.length||!pid||!assets||!db)return;
  const msg=t=>{const m=document.getElementById('upmsg');if(m)m.textContent=t};let done=0;
  for(const f of files){msg(`Uploading ${done+1} of ${files.length}…`);status('Uploading…');
    try{const blob=await shrink(f);const r=await assets.upload(blob);const key='M-'+r.id;
      const doc={id:key,key,asset:r.id,url:r.url,contentType:r.contentType,name:f.name,caption:pickProfile?'Profile photo':f.name.replace(/\.[^.]+$/,''),person:pid,addedAt:new Date().toISOString()};
      if(pickProfile&&/^image\//.test(r.contentType||'')){doc.profile=true;for(const x of mediaOf(pid))if(x.profile){x.profile=false;await db.collection('media').doc(x.key).set(x)}}
      MEDIA[key]=doc;await db.collection('media').doc(key).set(doc);done++}
    catch(err){const c=err&&err.code;msg(c==='unsupported_type'?`${f.name}: this file type can't be attached. Use a photo, scan or PDF.`:c==='too_large'?`${f.name} is over 20 MB.`:c==='quota_or_state'?'Storage is full.':`${f.name} didn't upload (${c||'error'}).`);status('Upload failed',true)}}
  if(done){status('Saved');render(true);if(selId===pid&&!document.getElementById('edform'))openSheet(pid)}});
const lb=document.getElementById('lb');

  lb.dataset.key=key;lb.hidden=false}

function toGed(){const im={},fm={};let i=0,j=0;Object.keys(P).forEach(k=>im[k]='@I'+(++i)+'@');Object.keys(F).forEach(k=>fm[k]='@F'+(++j)+'@');

  const ev=(t,e)=>{if(!e)return;L.push('1 '+t);if(e.date)L.push('2 DATE '+e.date);if(e.place)L.push('2 PLAC '+e.place)};
  Object.values(P).forEach(p=>{L.push(`0 ${im[p.id]} INDI`,'1 NAME '+(p.name||'Unknown'));{const n=splitName(p.name);if(n.given)L.push('2 GIVN '+n.given);if(n.surname)L.push('2 SURN '+n.surname);if(n.suffix)L.push('2 NSFX '+n.suffix);if(p.nick)L.push('2 NICK '+p.nick);
      if(p.maiden)L.push(`1 NAME ${n.given} /${p.maiden}/`,'2 TYPE birth')}L.push('1 SEX '+(p.sex||'U'));['BIRT','CHR','BAPM','DEAT','BURI'].forEach(t=>ev(t,p.ev[t]));

    mediaOf(p.id).forEach(m=>{L.push('1 OBJE','2 FILE '+new URL(m.url,location.href).href);if(m.caption)L.push('2 TITL '+m.caption)});
    p.famc.forEach(f=>fm[f]&&L.push('1 FAMC '+fm[f]));p.fams.forEach(f=>fm[f]&&L.push('1 FAMS '+fm[f]))});
  Object.values(F).forEach(f=>{L.push(`0 ${fm[f.id]} FAM`);if(f.husb)L.push('1 HUSB '+im[f.husb]);if(f.wife)L.push('1 WIFE '+im[f.wife]);f.chil.forEach(c=>L.push('1 CHIL '+im[c]));ev('MARR',f.ev.MARR&&(f.ev.MARR.date||f.ev.MARR.place)?f.ev.MARR:null)});

function findDups(){ // same person entered twice: first and last name match, the shorter name fits inside the longer, birth years agree or one is blank
  // sound-alike spelling: Vasquez/Vazquez/Basques, Ysidro/Isidro, Bregida/Brigida
  const ph=w=>w.replace(/qu/g,'k').replace(/c(?=[ei])/g,'s').replace(/c/g,'k').replace(/z/g,'s').replace(/v/g,'b').replace(/y/g,'i').replace(/h/g,'').replace(/(.)\1+/g,'$1').replace(/e/g,'i').replace(/o(?=$)/,'u').replace(/s$/,'')||w;
  const PN=n=>nrm(niceName(n)).split(' ').filter(Boolean).map(ph).join(' ');
  const W=p=>PN(p.name).split(' ').filter(Boolean);const g={};
  Object.values(P).forEach(p=>{const w=W(p);if(w.length<2||w.includes('unknown'))return;const k=w[0]+'|'+w[w.length-1];(g[k]=g[k]||[]).push(p)});
  const pre=p=>p.id.split(':')[0];
  const parNames=p=>{const f=parentsOf(p.id);return f?[f.husb,f.wife].filter(Boolean).map(x=>PN(P[x].name)).sort().join('+'):''};
  const sps=p=>famsOf(p.id).map(f=>spouseIn(f,p.id)).filter(Boolean);
  const kin=p=>{const f=parentsOf(p.id);return new Set([...(f?[f.husb,f.wife]:[]),...sps(p),...famsOf(p.id).flatMap(x=>x.chil)].filter(Boolean))};
  const spN=p=>new Set(sps(p).map(x=>PN(P[x].name)));
  const fits=(x,y)=>{const a=W(x),b=W(y);const[s,l]=a.length<=b.length?[a,b]:[b,a];return s.every(w=>l.includes(w))};
  const parFit=(x,y)=>{const a=parNames(x),b=parNames(y);if(!a||!b||a===b)return true;const fx=parentsOf(x.id),fy=parentsOf(y.id);return fx===fy};
  const parIds=p=>{const f=parentsOf(p.id);return f?[f.husb,f.wife].filter(Boolean):[]};
  const kidIds=p=>famsOf(p.id).flatMap(x=>x.chil);
  // strong evidence: same name and they share a parent, a spouse or a child (the same record imported twice)
  const shares=(x,y)=>parIds(x).some(z=>parIds(y).includes(z))||sps(x).some(z=>sps(y).includes(z))||kidIds(x).some(z=>kidIds(y).includes(z));
  const strong=(x,y)=>fits(x,y)&&!(by(x)&&by(y)&&by(x)!==by(y))&&shares(x,y)&&!kin(x).has(y.id)&&!kin(y).has(x.id);
  const sexOk=(x,y)=>!(x.sex&&y.sex&&x.sex!=='U'&&y.sex!=='U'&&x.sex!==y.sex);
  const same=(x,y)=>sexOk(x,y)&&(strong(x,y)||!(pre(x)===pre(y)&&pre(x)!=='N')&&fits(x,y)&&!(by(x)&&by(y)&&by(x)!==by(y))&&parFit(x,y)
    &&!kin(x).has(y.id)&&!kin(y).has(x.id)
    &&!(spN(x).size&&spN(y).size&&![...spN(x)].some(n=>spN(y).has(n)))
    &&!crossed(x,y)&&!crossed(y,x));
  function crossed(x,y){const f=parentsOf(x.id);if(!f)return false;const s=new Set(sps(y));return [f.husb,f.wife].some(z=>z&&s.has(z))}
  const score=p=>(p.id.startsWith('N:')?0:10)+(by(p)?2:0)+W(p).length;
  const out=[];Object.values(g).forEach(a=>{if(a.length<2)return;a.sort((x,y)=>score(y)-score(x));
    for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(same(a[i],a[j])&&canEditP(a[i].id)&&canEditP(a[j].id))out.push([a[i],a[j]])});
  return out}
function rel(p){const pf=parentsOf(p.id);const par=pf?[pf.husb,pf.wife].filter(Boolean).map(x=>niceName(P[x].name)):[];
  const sp=famsOf(p.id).map(f=>spouseIn(f,p.id)).filter(Boolean).map(x=>niceName(P[x].name));
  return [par.length?'child of '+par.join(' & '):'',sp.length?'married to '+sp.join(', '):''].filter(Boolean).join('; ')||'no relatives linked'}
function showDups(){const box=document.getElementById('dup-list');const ds=findDups();
  if(!ds.length){box.innerHTML='<p class="sub">No duplicates found.</p>';return}
  box.innerHTML=`<p class="sub">${ds.length} possible duplicate${ds.length>1?'s':''}. Check each pair is really the same person first. Merge combines each pair into one person: names, dates, places, notes, relatives and files. Where the two disagree, the first one's value is kept and the other is added to the notes. Admins can undo a merge from History.</p>${ds.length>1?'<div class="acts"><button class="btn" type="button" id="dup-all">Merge all '+ds.length+'</button></div>':''}`+
   ds.map(a=>`<div class="dup">${a.map((p,i)=>`<div><strong>${i?'Merge in':'Keep'}:</strong> ${esc(niceName(p.name))} <small>${years(p)} · ${esc(p.src)} · ${esc(rel(p))}</small></div>`).join('')}
    <div class="acts"><button class="btn" type="button" data-merge="${esc(a.map(p=>p.id).join('|'))}">Merge</button><button class="btn" type="button" data-show="${esc(a[0].id)}">View</button></div></div>`).join('');
  box.querySelectorAll('[data-merge]').forEach(b=>b.onclick=async()=>{const ids=b.dataset.merge.split('|');b.disabled=true;b.textContent='Merging…';
    ids.slice(1).forEach(d=>mergeInto(ids[0],d));rebuild();render(true);await flush();showDups()});
  const all=document.getElementById('dup-all');if(all)all.onclick=async()=>{if(!all.dataset.armed){all.dataset.armed='1';all.textContent='Tap again to merge all '+ds.length;return}
    all.disabled=true;all.textContent='Merging…';ds.forEach(([k,d])=>{if(P[k.id]&&P[d.id]){mergeInto(k.id,d.id);rebuild()}});render(true);await flush();showDups()};
  box.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{setFocus(b.dataset.show)})}
function mergeInto(keep,drop){const K=P[keep],D=P[drop];if(!K||!D)return;
  // relatives: point every family at the kept person
  const touched={};
  Object.values(F).forEach(f=>{if(f.husb!==drop&&f.wife!==drop&&!f.chil.includes(drop))return;const c=JSON.parse(JSON.stringify(f));
    if(c.husb===drop)c.husb=keep;if(c.wife===drop)c.wife=keep;c.chil=[...new Set(c.chil.map(x=>x===drop?keep:x))];touched[c.id]=c});
  const all=Object.values(F).map(f=>touched[f.id]||f);

  const seen={};all.forEach(f=>{if(!f.husb||!f.wife)return;const k=f.husb+'+'+f.wife;
    if(seen[k]){const a=touched[seen[k].id]||(touched[seen[k].id]=JSON.parse(JSON.stringify(seen[k])));a.chil=[...new Set(a.chil.concat(f.chil))];
      const am=a.ev.MARR||{},fm=f.ev.MARR||{};if(!am.date&&fm.date||!am.place&&fm.place)a.ev.MARR={date:am.date||fm.date||'',place:am.place||fm.place||''};

  const yr=d=>((d||'').match(/\d{4}/)||[''])[0];

  const pickDate=(a,b,label)=>{if(!a)return b||'';if(!b||nrm(a)===nrm(b))return a;const ta=toks(a),tb=toks(b);

    extra.push(label+' also recorded as '+fmtDate(b));return a};
  const pickPlace=(a,b,label)=>{if(!a)return b||'';if(!b||a===b)return a;const x=nrm(a),y=nrm(b);if(y.includes(x))return b;if(x.includes(y))return a;extra.push(label+' also recorded as '+b);return a};
  const longer=(a,b)=>{a=a||'';b=b||'';if(!a)return b;if(!b)return a;const x=nrm(a),y=nrm(b);return y.includes(x)&&y.length>x.length?b:a};
  const kn=splitName(K.name),dn=splitName(D.name);
  const km=K.middle!=null?K.middle:'',dm=D.middle!=null?D.middle:'';
  const kg=km&&kn.given.endsWith(' '+km)?kn.given.slice(0,-km.length-1):kn.given,dg=dm&&dn.given.endsWith(' '+dm)?dn.given.slice(0,-dm.length-1):dn.given;

  if(dn.surname&&kn.surname&&nrm(dn.surname)!==nrm(kn.surname)&&!K.maiden&&!D.maiden&&(K.sex==='F'||D.sex==='F'))extra.push('Other surname: '+dn.surname);

const nrm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const by=p=>((birthOf(p).date||'').match(/\d{4}/)||[''])[0];

  const toks=d=>nrm(d).split(' ').filter(Boolean);

    else if(y&&byKey[n+'|'+y]&&byKey[n+'|'+y].length===1)m=byKey[n+'|'+y][0];

    const b=ip.ev.BIRT||ip.ev.CHR||ip.ev.BAPM||{},d=ip.ev.DEAT||ip.ev.BURI||{};

      const dt=(a,bb,label)=>{if(!upd||!a||!bb)return a||bb||'';if(nrm(a)===nrm(bb))return a;const ta=toks(a),tb=toks(bb);
        if(ta.every(t=>tb.includes(t)))return bb;if(tb.every(t=>ta.includes(t)))return a;extra.push(label+' previously recorded as '+fmtDate(a));return bb};
      const pl=(a,bb,label)=>{if(!upd||!a||!bb)return a||bb||'';const x=nrm(a),z=nrm(bb);if(x===z||x.includes(z))return a;if(z.includes(x))return bb;extra.push(label+' previously recorded as '+a);return bb};

        birthDate:dt(mb.date,b.date,'Birth'),birthPlace:pl(mb.place,b.place,'Birthplace'),deathDate:dt(md.date,d.date,'Death'),deathPlace:pl(md.place,d.place,'Death place')};

    else{const nid='N:@I'+uid()+'@';map[ip.id]=nid;newP.push([nid,{maiden:ip.maiden||'',nick:ip.nick||'',name:ip.name||'Unknown /?/',sex:ip.sex||'U',birthDate:b.date||'',birthPlace:b.place||'',deathDate:d.date||'',deathPlace:d.place||'',note:ip.notes.join('\n\n')}])}});
  const famW=[];let famNew=0,famUpd=0;
  Object.values(IF).forEach(f=>{const h=f.husb&&map[f.husb],w=f.wife&&map[f.wife],kids=f.chil.map(c=>map[c]).filter(Boolean);if(!h&&!w&&kids.length<2)return;

const toHash=id=>id.replace(/[:@]/g,'').replace(/^([A-Z])(I)/,'$1-$2');
const fromHash=h=>{const m=h.match(/^([A-Za-z])-?(I\d+)$/);return m?`${m[1].toUpperCase()}:@${m[2]}@`:null};
function setFocus(id,fromNav){if(!P[id])return;focusId=id;render(false);openSheet(id);if(!fromNav){try{history.replaceState(null,'','#'+toHash(id))}catch(e){location.hash=toHash(id)}}}
const homeId=()=>{if(DATA&&DATA.homeId&&P[DATA.homeId])return DATA.homeId;const h=DATA&&DATA.home&&Object.values(P).find(p=>niceName(p.name).toLowerCase()===DATA.home.toLowerCase());return h?h.id:(Object.keys(P)[0]||null)};
addEventListener('hashchange',()=>{const id=fromHash(location.hash.slice(1));if(id&&P[id]&&id!==focusId)setFocus(id,true)});

const upSel=document.getElementById('up'),dnSel=document.getElementById('down');upSel.value=String(UP);dnSel.value=String(DOWN);
if(upSel.value!==String(UP)){UP=3;upSel.value='3'}if(dnSel.value!==String(DOWN)){DOWN=2;dnSel.value='2'}
upSel.onchange=()=>{UP=+upSel.value;try{localStorage.setItem('ft-up',UP)}catch(e){}render(false)};

// ---------- list and stats ----------
const NOW=new Date().getFullYear();
const byr=p=>{const y=+((birthOf(p).date||'').match(/\d{4}/)||[0])[0];return y||null};
const dyr=p=>{const y=+((deathOf(p).date||'').match(/\d{4}/)||[0])[0];return y||null};
const lifespan=p=>{const b=byr(p),d=dyr(p);return b&&d&&d>=b&&d-b<120?d-b:null};
const ageNow=p=>{const b=byr(p);return b&&!isDead(p)&&NOW-b<110?NOW-b:null};
const surnameOf=p=>splitName(p.name).surname.trim();
const firstOf=p=>(splitName(p.name).given.split(/\s+/)[0]||'').replace(/[^\p{L}.'-]/gu,'');
const townOf=pl=>(pl||'').split(',')[0].trim();
const bplace=p=>(p.ev.BIRT&&p.ev.BIRT.place)||(p.ev.CHR&&p.ev.CHR.place)||(p.ev.BAPM&&p.ev.BAPM.place)||'';
let V={tab:'list',scope:'all',line:'',sort:'name',dir:1,q:'',past:false,lineTo:'father',relA:null,relB:null};
function scopePeople(){const all=Object.values(P);
  if(V.scope==='anc'){const s=new Set(),st=[focusId];while(st.length){const x=st.pop();if(!x||s.has(x))continue;s.add(x);const f=parentsOf(x);if(f)st.push(f.husb,f.wife)}return all.filter(p=>s.has(p.id))}
  if(V.scope==='desc'){const s=new Set(),st=[focusId];while(st.length){const x=st.pop();if(!x||s.has(x))continue;s.add(x);famsOf(x).forEach(f=>{st.push(...f.chil);const sp=spouseIn(f,x);if(sp)s.add(sp)})}return all.filter(p=>s.has(p.id))}
  if(V.scope==='line'&&V.line){const L=nrm(V.line);return all.filter(p=>nrm(surnameOf(p))===L||nrm(p.maiden||'')===L)}
  return all}
function openViews(tab){if(tab)V.tab=tab;const box=document.getElementById('views');box.hidden=false;sheet.hidden=true;
  const sc={};Object.values(P).forEach(p=>{const s=surnameOf(p);if(s&&s!=='?')sc[s]=(sc[s]||0)+1});
  const lines=Object.entries(sc).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,60);
  if(!V.line&&lines.length)V.line=lines[0][0];
  const fname=P[focusId]?niceName(P[focusId].name):'this person';
  box.innerHTML=`<div class="vbar"><div class="tabs"><button class="btn" type="button" data-vt="list" aria-pressed="${V.tab==='list'}">List</button><button class="btn" type="button" data-vt="stats" aria-pressed="${V.tab==='stats'}">Stats</button><button class="btn" type="button" data-vt="bday" aria-pressed="${V.tab==='bday'}">Birthdays</button><button class="btn" type="button" data-vt="line" aria-pressed="${V.tab==='line'}">Line</button><button class="btn" type="button" data-vt="rel" aria-pressed="${V.tab==='rel'}">Relationship</button></div>
    <select id="v-scope" aria-label="Who to include"${V.tab==='line'||V.tab==='rel'?' hidden':''}><option value="all"${V.scope==='all'?' selected':''}>Everyone</option><option value="anc"${V.scope==='anc'?' selected':''}>Ancestors of ${esc(fname)}</option><option value="desc"${V.scope==='desc'?' selected':''}>Descendants of ${esc(fname)}</option><option value="line"${V.scope==='line'?' selected':''}>A family line (surname)</option></select>
    <select id="v-line" aria-label="Family line"${V.scope==='line'&&V.tab!=='line'&&V.tab!=='rel'?'':' hidden'}>${lines.map(([n,c])=>`<option value="${esc(n)}"${n===V.line?' selected':''}>${esc(n)} (${c})</option>`).join('')}</select>
    ${V.tab==='list'?`<input id="v-q" type="search" placeholder="Filter by name or place" value="${esc(V.q)}">`:''}
    <button class="btn vclose" type="button" id="v-close">Back to tree</button></div><div class="vbody" id="v-body"></div>`;
  box.querySelectorAll('[data-vt]').forEach(b=>b.onclick=()=>openViews(b.dataset.vt));
  document.getElementById('v-scope').onchange=e=>{V.scope=e.target.value;openViews()};
  document.getElementById('v-line').onchange=e=>{V.line=e.target.value;openViews()};
  const qi=document.getElementById('v-q');if(qi)qi.oninput=()=>{V.q=qi.value;drawList()};
  document.getElementById('v-close').onclick=()=>{box.hidden=true};
  if(V.tab==='list')drawList();else if(V.tab==='bday')drawBirthdays();else if(V.tab==='line')drawLine();else if(V.tab==='rel')drawRel();else drawStats()}
function drawList(){const body=document.getElementById('v-body');const t=nrm(V.q);
  let ps=scopePeople().filter(p=>!t||t.split(' ').every(w=>nrm(niceName(p.name)+' '+(p.maiden||'')+' '+(p.nick||'')+' '+bplace(p)+' '+(deathOf(p).place||'')).includes(w)));
  const key={name:p=>nrm(surnameOf(p)+' '+niceName(p.name)),born:p=>byr(p)||9999,died:p=>dyr(p)||9999,age:p=>lifespan(p)??ageNow(p)??-1,place:p=>nrm(bplace(p)||'~')}[V.sort];
  ps.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*V.dir});
  const th=(k,l,c)=>`<th data-sort="${k}"${c?` class="${c}"`:''}>${l}${V.sort===k?(V.dir>0?' ▲':' ▼'):''}</th>`;
  const sw=p=>`<span class="sx" style="background:var(--${p.sex==='M'?'m':p.sex==='F'?'f':'u'}-edge)" aria-hidden="true"></span>`;
  body.innerHTML=`<p class="vnote" style="margin:0 0 8px">${ps.length} ${ps.length===1?'person':'people'}. Tap a person to see them in the tree.</p>
   <table class="ptable"><thead><tr>${th('name','Name')}${th('born','Born')}${th('place','Birthplace','hide-s')}${th('died','Died')}${th('age','Age')}</tr></thead><tbody>
   ${ps.map(p=>{const ls=lifespan(p),an=ageNow(p);return`<tr data-id="${esc(p.id)}"><td>${sw(p)}${esc(plateName(p))}${p.nick?` <small>“${esc(p.nick)}”</small>`:''}</td>
     <td>${esc(fmtDate(birthOf(p).date||''))}</td><td class="hide-s">${esc(bplace(p))}</td><td>${esc(fmtDate(deathOf(p).date||''))}</td><td>${ls!=null?ls:an!=null?an+' <small>living</small>':''}</td></tr>`}).join('')}</tbody></table>`;
  body.querySelectorAll('th[data-sort]').forEach(h=>h.onclick=()=>{const k=h.dataset.sort;if(V.sort===k)V.dir=-V.dir;else{V.sort=k;V.dir=1}drawList()});
  body.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>{document.getElementById('views').hidden=true;setFocus(r.dataset.id)})}
function drawStats(){const body=document.getElementById('v-body');const ps=scopePeople();const ids=new Set(ps.map(p=>p.id));
  const n=ps.length,m=ps.filter(p=>p.sex==='M').length,f=ps.filter(p=>p.sex==='F').length,u=n-m-f;
  const dead=ps.filter(isDead).length,living=ps.filter(p=>!isDead(p)&&byr(p)).length;
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const lsAll=ps.map(lifespan).filter(x=>x!=null),lsM=ps.filter(p=>p.sex==='M').map(lifespan).filter(x=>x!=null),lsF=ps.filter(p=>p.sex==='F').map(lifespan).filter(x=>x!=null);
  const oldest=ps.filter(p=>lifespan(p)!=null).sort((a,b)=>lifespan(b)-lifespan(a))[0];
  const fams=Object.values(F).filter(fm=>[fm.husb,fm.wife].some(x=>x&&ids.has(x)));const withKids=fams.filter(fm=>fm.chil.length);
  const kidsAvg=withKids.length?(withKids.reduce((a,fm)=>a+fm.chil.length,0)/withKids.length).toFixed(1):null;
  const pa={M:[],F:[]};ps.forEach(c=>{const cb=byr(c);const pf=parentsOf(c.id);if(!cb||!pf)return;[['M',pf.husb],['F',pf.wife]].forEach(([k,x])=>{const b=x&&P[x]&&byr(P[x]);if(b&&cb-b>=12&&cb-b<=65)pa[k].push(cb-b)})});
  const ys=ps.map(byr).filter(Boolean);const y0=ys.length?Math.min(...ys):null,y1=ys.length?Math.max(...ys):null;
  const tile=(k,v,d,extra)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v??'–'}</div>${d?`<div class="d">${d}</div>`:''}${extra||''}</div>`;
  const pct=x=>n?Math.round(100*x/n)+'%':'';
  const split=`<div class="split" role="img" aria-label="${m} men, ${f} women${u?', '+u+' unknown':''}">${m?`<span title="Men: ${m}" style="flex:${m};background:var(--m-edge)"></span>`:''}${f?`<span title="Women: ${f}" style="flex:${f};background:var(--f-edge)"></span>`:''}${u?`<span title="Unknown: ${u}" style="flex:${u};background:var(--u-edge)"></span>`:''}</div>`;
  const hbars=(rows,title,note)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return`<div class="chart"><h3>${title}</h3>${rows.length?rows.map(([l,c])=>`<div class="hbar" title="${esc(l)}: ${c}"><span class="t">${esc(l)}</span><span class="b" style="width:${100*c/mx}%"></span><span class="n">${c}</span></div>`).join(''):'<p class="vnote">Not enough data.</p>'}${note?`<p class="vnote">${note}</p>`:''}</div>`};
  const count=fn=>{const o={};ps.forEach(p=>{const k=fn(p);if(k)o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,8)};
  // births per decade
  const dec={};ys.forEach(y=>{const d=Math.floor(y/10)*10;dec[d]=(dec[d]||0)+1});
  let decs=[];if(ys.length){for(let d=Math.floor(y0/10)*10;d<=Math.floor(y1/10)*10;d+=10)decs.push([d,dec[d]||0])}
  const dmx=Math.max(1,...decs.map(x=>x[1]));const step=Math.max(1,Math.ceil(decs.length/5));
  const decChart=`<div class="chart"><h3>Births per decade</h3>${decs.length?`<div class="cols" role="img" aria-label="Births per decade">${decs.map(([d,c])=>`<span class="c" title="${d}s: ${c} born" style="height:${100*c/dmx}%"></span>`).join('')}</div>
    <div class="colx">${decs.map(([d],i)=>`<span>${i%step===0?d+'s':''}</span>`).join('')}</div>`:'<p class="vnote">No birth years yet.</p>'}</div>`;
  // average lifespan by birth century
  const cen={};ps.forEach(p=>{const l=lifespan(p);if(l==null)return;const c=Math.floor(byr(p)/100)*100;(cen[c]=cen[c]||[]).push(l)});
  const cenRows=Object.keys(cen).sort().map(c=>[c+'s ('+cen[c].length+')',avg(cen[c])]);
  body.innerHTML=`<div class="tiles">
    ${tile('People',n,y0?`born ${y0}–${y1}`:'')}
    ${tile('Men · Women',`${m} · ${f}`,`${pct(m)} men, ${pct(f)} women${u?`, ${u} unknown`:''}`,split)}
    ${tile('Living · Deceased',`${living} · ${dead}`,`${n-living-dead?(n-living-dead)+' unknown (no dates). ':''}Born after 1926 with no death date counts as living`)}
    ${tile('Average lifespan',avg(lsAll)!=null?avg(lsAll)+' yrs':null,`${lsAll.length} people with both years`)}
    ${tile('Men · Women lifespan',`${avg(lsM)??'–'} · ${avg(lsF)??'–'}`,'average years')}
    ${tile('Longest life',oldest?lifespan(oldest)+' yrs':null,oldest?esc(niceName(oldest.name)):'')}
    ${tile('Children per family',kidsAvg,`${withKids.length} families with children`)}
    ${tile('Parents’ age at a birth',`${avg(pa.M)??'–'} · ${avg(pa.F)??'–'}`,'fathers · mothers, average')}
  </div><div class="charts">
    ${decChart}
    ${hbars(cenRows,'Average lifespan by birth century','Years lived, for people with birth and death years. The count is in brackets.')}
    ${hbars(count(surnameOf),'Most common surnames')}
    ${hbars(count(firstOf),'Most common first names')}
    ${hbars(count(p=>townOf(bplace(p))),'Most common birthplaces')}
  </div><p class="vnote">Based on the dates in the tree. People without dates are counted where possible but left out of ages.</p>`}
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
function bdayOf(p){const d=(birthOf(p).date||'').toUpperCase();if(/^(ABT|EST|CAL|BEF|AFT|BET)/.test(d))return null;const m=d.match(/(\d{1,2})\s+([A-Z]{3})/);if(!m||!(m[2] in MON3))return null;return{day:+m[1],mon:MON3[m[2]],year:+((d.match(/\d{4}/)||[0])[0])||null}}
function drawBirthdays(){const body=document.getElementById('v-body');const today=new Date();today.setHours(0,0,0,0);
  const rows=[];scopePeople().forEach(p=>{const b=bdayOf(p);if(!b)return;const dead=isDead(p);if(dead&&!V.past)return;
    let next=new Date(today.getFullYear(),b.mon,b.day);if(next<today)next=new Date(today.getFullYear()+1,b.mon,b.day);
    const days=Math.round((next-today)/864e5);rows.push({p,b,dead,next,days,turns:b.year?next.getFullYear()-b.year:null})});
  rows.sort((a,b)=>a.days-b.days||plateName(a.p).localeCompare(plateName(b.p)));
  const groups=[];rows.forEach(r=>{const k=r.next.getFullYear()+'-'+r.next.getMonth();let g=groups[groups.length-1];if(!g||g.k!==k)groups.push(g={k,label:MONTHS[r.next.getMonth()]+(r.next.getFullYear()!==today.getFullYear()?' '+r.next.getFullYear():''),rows:[]});g.rows.push(r)});
  const when=d=>d===0?'<strong>Today</strong>':d===1?'Tomorrow':d<7?'In '+d+' days':'';
  body.innerHTML=`<p class="vnote" style="margin:0 0 8px">${rows.length} ${V.past?'birthdays':'birthdays of living family'}, starting today. Only people with a full birth date (day and month) are listed.
    <label style="display:inline-flex;gap:6px;align-items:center;margin-left:8px;color:var(--fg)"><input type="checkbox" id="v-past"${V.past?' checked':''}> Include those who have passed</label></p>
   ${groups.map(g=>`<h3 style="font-size:14px;margin:16px 0 4px">${g.label}</h3><table class="ptable"><tbody>${g.rows.map(r=>`<tr data-id="${esc(r.p.id)}"><td style="width:64px">${r.b.day} ${MONTHS[r.b.mon].slice(0,3)}</td>
     <td><span class="sx" style="background:var(--${r.p.sex==='M'?'m':r.p.sex==='F'?'f':'u'}-edge)" aria-hidden="true"></span>${esc(plateName(r.p))}${r.dead?' <small>(passed)</small>':''}</td>
     <td style="text-align:right;white-space:nowrap">${r.turns!=null?(r.dead?r.turns+' years since birth':'Turns '+r.turns):''} <small>${when(r.days)}</small></td></tr>`).join('')}</tbody></table>`).join('')||'<p class="vnote">No full birth dates yet. Add a day and month to someone’s birth date to see them here.</p>'}`;
  const cb=document.getElementById('v-past');if(cb)cb.onchange=()=>{V.past=cb.checked;drawBirthdays()};
  body.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>{document.getElementById('views').hidden=true;setFocus(r.dataset.id)})}

// ---------- direct line chart (one ancestor per generation) ----------
function linePath(start,mode){const path=[start];let cur=start;const seen=new Set([start]);
  let target=null,targetSet=null;
  if(mode!=='father'&&mode!=='mother'){target=mode;const up=new Map();const st=[start];up.set(start,null);
    while(st.length){const x=st.shift();if(x===target)break;const f=parentsOf(x);if(!f)continue;[f.husb,f.wife].forEach(y=>{if(y&&!up.has(y)){up.set(y,x);st.push(y)}})}
    if(up.has(target)){const chain=[];let x=target;while(x){chain.unshift(x);x=up.get(x)}return chain}return path}
  for(;;){const f=parentsOf(cur);const nx=f&&(mode==='father'?f.husb||null:f.wife||null);if(!nx||seen.has(nx))break;path.push(nx);seen.add(nx);cur=nx}
  return path}
function drawLine(){const body=document.getElementById('v-body');const me=focusId;if(!P[me]){body.innerHTML='<p class="vnote">Pick someone in the tree first.</p>';return}
  const anc=[];{const st=[[me,0]],seen=new Set([me]);while(st.length){const[x,d]=st.shift();const f=parentsOf(x);if(!f)continue;[f.husb,f.wife].forEach(y=>{if(y&&!seen.has(y)){seen.add(y);anc.push([y,d+1]);st.push([y,d+1])}})}}
  if(V.lineTo!=='father'&&V.lineTo!=='mother'&&!anc.some(a=>a[0]===V.lineTo))V.lineTo='father';
  const path=linePath(me,V.lineTo); // path[0]=me, path[n]=oldest
  const yr=d=>year(d||'');const ev=(lab,e)=>e&&(e.date||e.place)?`${lab} ${esc(fmtDate(e.date||''))}${e.place?' '+esc(townOf(e.place)):''}`:'';
  const life=p=>[ev('b.',p.ev.BIRT)||ev('bapt.',p.ev.CHR||p.ev.BAPM),ev('d.',p.ev.DEAT)||ev('bur.',p.ev.BURI)].filter(Boolean).join(', ');
  const nmb=id=>`<button type="button" data-go-line="${esc(id)}">${esc(plateName(P[id]))}</button>`;
  const first=id=>esc(firstOf(P[id])||plateName(P[id]));
  const pars=id=>{const f=parentsOf(id);if(!f)return'';const ps=[f.husb,f.wife].filter(Boolean);return ps.map(x=>esc(plateName(P[x]))).join(' + ')};
  const cards=path.slice().reverse().map((id,i,arr)=>{const g=arr.length-i;const p=P[id];const child=arr[i+1];
    let fam=null;if(child){fam=famsOf(id).find(f=>f.chil.includes(child))||null}
    const sp=fam?spouseIn(fam,id):null;
    const lines=[];const l1=[p&&life(p)?first(id)+' '+life(p):'',sp&&life(P[sp])?first(sp)+' '+life(P[sp]):''].filter(Boolean).join(' · ');if(l1)lines.push(l1);
    if(fam&&fam.ev.MARR&&(fam.ev.MARR.date||fam.ev.MARR.place))lines.push('Married '+esc(fmtDate(fam.ev.MARR.date||''))+(fam.ev.MARR.place?', '+esc(townOf(fam.ev.MARR.place)):''));
    if(fam&&fam.chil.length>1){const ks=fam.chil.map(k=>P[k]).filter(Boolean);lines.push('Children: '+ks.map(k=>esc(firstOf(k)||plateName(k))+(byr(k)?' '+byr(k):'')).join(', '))}
    if(!child&&!l1&&p)lines.push(esc(life(p)||''));
    const rem=[];if(sp&&pars(sp))rem.push(`${first(sp)}’s parents: <strong>${pars(sp)}</strong>`);
    const oth=famsOf(id).filter(f=>f!==fam&&spouseIn(f,id)).map(f=>esc(plateName(P[spouseIn(f,id)])));if(child&&oth.length)rem.push(`${first(id)} also married ${oth.join(', ')}`);
    const note=(p.notes||[])[0];if(note)rem.push(esc(note.length>180?note.slice(0,177)+'…':note));
    return`<div class="lc-row"><div class="lc-gen">G${g}</div><div class="lc-card${id===me?' me':''}"><h4>${nmb(id)}${sp?`<span class="plus">+</span>${nmb(sp)}`:''}</h4>${lines.map(l=>`<p>${l}</p>`).join('')}</div>
      <div class="lc-rem">${rem.map(r=>`<p>${r}</p>`).join('')}</div></div>${child?'<div class="lc-link"><span></span></div>':''}`}).join('');
  const mode=V.lineTo==='father'?'father’s line':V.lineTo==='mother'?'mother’s line':'line to '+plateName(P[V.lineTo]);
  const sur=surnameOf(P[path[path.length-1]]);
  body.innerHTML=`<div class="lc-wrap"><div class="lc-ctl"><label class="vnote" style="margin:0">Line<select id="lc-to" style="margin-left:6px">
     <option value="father"${V.lineTo==='father'?' selected':''}>Father’s line (father to father)</option><option value="mother"${V.lineTo==='mother'?' selected':''}>Mother’s line (mother to mother)</option>
     ${anc.filter(a=>a[1]>1).sort((a,b)=>a[1]-b[1]||plateName(P[a[0]]).localeCompare(plateName(P[b[0]]))).map(([a,d])=>`<option value="${esc(a)}"${V.lineTo===a?' selected':''}>Up to ${esc(plateName(P[a]))} (G${d+1})</option>`).join('')}</select></label>
     <button class="btn" type="button" id="lc-print">Print or save as PDF</button></div>
   <h2 style="font-family:var(--font-display);margin:0 0 2px">${esc(sur||'Family')} Ancestry</h2><p class="vnote" style="margin:0 0 14px">${esc(plateName(P[me]))}’s ${esc(mode)} · ${path.length} generation${path.length>1?'s':''}. Pick another person in the tree to start from them.</p>
   ${path.length>1?cards:cards+'<p class="vnote">No parents recorded on this line yet.</p>'}</div>`;
  document.getElementById('lc-to').onchange=e=>{V.lineTo=e.target.value;drawLine()};
  document.getElementById('lc-print').onclick=()=>window.print();

// ---------- how two people are related ----------
function upMap(id){const m=new Map([[id,{d:0,down:null}]]);const q=[id];
  while(q.length){const x=q.shift();const f=parentsOf(x);if(!f)continue;[f.husb,f.wife].forEach(y=>{if(y&&!m.has(y)){m.set(y,{d:m.get(x).d+1,down:x});q.push(y)}})}return m}
const ORD=['','','grand','great-grand'];
function greats(n){return n<=0?'':(n===1?'great-':n===2?'great-great-':n+'× great-')}
const nth=n=>n+(n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th');
const times=n=>n===1?'once':n===2?'twice':n+' times';
function relName(a,b,sex,half){return (half&&a>0&&b>0?'half ':'')+relName0(a,b,sex)}
function relName0(a,b,sex,half){const g=(m,f,u)=>sex==='M'?m:sex==='F'?f:u;const H='';
  if(a===0&&b===0)return'same person';
  if(a===0)return b===1?g('son','daughter','child'):b===2?g('grandson','granddaughter','grandchild'):greats(b-2)+g('grandson','granddaughter','grandchild');
  if(b===0)return a===1?g('father','mother','parent'):a===2?g('grandfather','grandmother','grandparent'):greats(a-2)+g('grandfather','grandmother','grandparent');
  if(a===1&&b===1)return H+g('brother','sister','sibling');
  if(b===1)return (a===2?'':greats(a-2))+H+g('uncle','aunt','uncle or aunt');
  if(a===1)return (b===2?'':b===3?'grand-':greats(b-3)+'grand-')+H+g('nephew','niece','nephew or niece');
  const c=Math.min(a,b)-1,r=Math.abs(a-b);return H+nth(c)+' cousin'+(r?' '+times(r)+' removed':'')}
function bloodLinks(A,B){const ma=upMap(A),mb=upMap(B);const common=[...ma.keys()].filter(k=>mb.has(k));
  const isAncOfOther=x=>common.some(y=>y!==x&&upMap(y).has(x));
  const lcas=common.filter(x=>!isAncOfOther(x));
  // pair spouses who are both closest common ancestors at the same depths
  const out=[],used=new Set();
  lcas.forEach(x=>{if(used.has(x))return;used.add(x);const sp=famsOf(x).map(f=>spouseIn(f,x)).find(y=>y&&lcas.includes(y)&&!used.has(y)&&ma.get(y).d===ma.get(x).d&&mb.get(y).d===mb.get(x).d);
    if(sp)used.add(sp);out.push({top:sp?[x,sp]:[x],a:ma.get(x).d,b:mb.get(x).d,half:!sp&&ma.get(x).d>0&&mb.get(x).d>0})});
  const chain=(m,top)=>{const c=[];let x=m.get(top).down;while(x){c.push(x);x=m.get(x).down}return c}; // from just below top down to the person
  out.forEach(o=>{o.pa=chain(ma,o.top[0]);o.pb=chain(mb,o.top[0])});
  return out.sort((x,y)=>(x.a+x.b)-(y.a+y.b))}
function marriagePath(A,B){const prev=new Map([[A,null]]);const q=[A];
  while(q.length){const x=q.shift();if(x===B)break;const f=parentsOf(x);const nb=[];
    if(f)[f.husb,f.wife].forEach(y=>y&&nb.push([y,'parent']));famsOf(x).forEach(fm=>{const sp=spouseIn(fm,x);if(sp)nb.push([sp,'spouse']);fm.chil.forEach(c=>nb.push([c,'child']))});
    for(const[y,k]of nb)if(!prev.has(y)){prev.set(y,[x,k]);q.push(y)}}
  if(!prev.has(B))return null;const steps=[];let x=B;while(prev.get(x)){const[px,k]=prev.get(x);steps.unshift([px,k,x]);x=px}
  // parent then child of the same parent = brother/sister
  const out=[];for(let i=0;i<steps.length;i++){const s=steps[i],n=steps[i+1];if(n&&s[1]==='parent'&&n[1]==='child'){out.push([s[0],'sibling',n[2]]);i++}else out.push(s)}
  return out}
function stepWord(k,id){const sx=P[id].sex;const g=(m,f,u)=>sx==='M'?m:sx==='F'?f:u;
  return k==='parent'?g('father','mother','parent'):k==='child'?g('son','daughter','child'):k==='spouse'?g('husband','wife','spouse'):g('brother','sister','sibling')}
function inlawName(steps){const ks=steps.map(s=>s[1]).join(','),last=steps[steps.length-1][2];const sx=P[last].sex;const g=(m,f,u)=>sx==='M'?m:sx==='F'?f:u;
  return {'spouse':g('husband','wife','spouse'),'spouse,parent':g('father-in-law','mother-in-law','parent-in-law'),'child,spouse':g('son-in-law','daughter-in-law','child-in-law'),
    'spouse,sibling':g('brother-in-law','sister-in-law','sibling-in-law'),'sibling,spouse':g('brother-in-law','sister-in-law','sibling-in-law'),'parent,spouse':g('stepfather','stepmother','step-parent'),'spouse,child':g('stepson','stepdaughter','stepchild')}[ks]||null}
function drawRel(){const body=document.getElementById('v-body');if(!V.relA||!P[V.relA])V.relA=focusId;if(V.relB&&!P[V.relB])V.relB=null;
  const A=V.relA,B=V.relB;const nm=id=>esc(plateName(P[id]));
  const chipB=(id,end)=>`<button type="button" class="rl-chip${end?' end':''}" data-go-rel="${esc(id)}">${nm(id)}${years(P[id])?`<small>${years(P[id])}</small>`:''}</button>`;
  let html=`<div class="rl-pick">${['A','B'].map(k=>`<div class="exist"><label>${k==='A'?'First person':'Second person'}<input type="search" data-rp="${k}" placeholder="Search by name" value="${V['rel'+k]?esc(plateName(P[V['rel'+k]])):''}" autocomplete="off"></label><div class="results" data-rr="${k}" hidden></div></div>`).join('')}</div>`;
  if(A&&B&&A!==B){const links=bloodLinks(A,B);const first=esc(firstOf(P[A])||plateName(P[A]));
    links.forEach(o=>{const name=relName(o.a,o.b,P[B].sex,o.half);
      const col=(arr,end)=>`<div class="rl-col">${arr.map((id,i)=>`<span class="rl-arrow">↓</span>${chipB(id,i===arr.length-1)}`).join('')}</div>`;
      const top=o.top.map(id=>chipB(id,id===A||id===B)).join(' <span class="rl-arrow">+</span> ');
      html+=`<div class="rl-card"><h3>${nm(B)} is ${first}’s ${esc(name)}</h3><p class="why">${o.a===0||o.b===0?'Direct line':'Closest shared ancestor'+(o.top.length>1?'s':'')}: ${o.top.map(nm).join(' & ')}${o.a&&o.b?` (${o.a} generation${o.a>1?'s':''} up from ${first}, ${o.b} from ${esc(firstOf(P[B])||plateName(P[B]))})`:''}</p>
        <div class="rl-tree"><div class="rl-top">${top}</div>${o.a&&o.b?col(o.pa)+col(o.pb):`<div class="rl-col" style="grid-column:1/-1">${(o.a?o.pa:o.pb).map((id,i,arr)=>`<span class="rl-arrow">↓</span>${chipB(id,i===arr.length-1)}`).join('')}</div>`}</div></div>`});
    const mp=marriagePath(A,B);const usesMarriage=mp&&mp.some(s=>s[1]==='spouse');
    if(mp&&(usesMarriage||!links.length)){const word=inlawName(mp);
      const phrase=mp.map(s=>stepWord(s[1],s[2])).join('’s ');
      html+=`<div class="rl-card"><h3>${nm(B)} is ${first}’s ${esc(word||phrase)}</h3><p class="why">${links.length?'Also connected through marriage':'Connected through marriage'}${word?'':': '+first+'’s '+esc(phrase)} (${mp.length} step${mp.length>1?'s':''})</p>
        <div class="rl-steps">${chipB(A,true)}${mp.map(s=>`<span class="rl-arrow">→ ${esc(stepWord(s[1],s[2]))} →</span>${chipB(s[2],s[2]===B)}`).join('')}</div></div>`}
    if(!links.length&&!mp)html+=`<div class="rl-card"><h3>No connection found</h3><p class="why">These two aren’t linked in the tree yet.</p></div>`}
  else html+=`<p class="vnote">${A===B&&B?'Pick two different people.':'Pick the second person to see how they’re related. The first person starts as whoever you selected in the tree.'}</p>`;
  body.innerHTML=html;
  body.querySelectorAll('[data-rp]').forEach(inp=>{const k=inp.dataset.rp,rs=body.querySelector(`[data-rr="${k}"]`);
    inp.oninput=()=>{const hits=window.__treeSearch(inp.value);rs.innerHTML=hits.map(h=>`<button type="button" data-rpick="${esc(h.id)}">${esc(h.name)} <small>${esc(h.years)}</small></button>`).join('')||'<button type="button" disabled>No match</button>';rs.hidden=!inp.value.trim()};
    rs.onclick=e=>{const b=e.target.closest('[data-rpick]');if(!b)return;V['rel'+k]=b.dataset.rpick;drawRel()}});
  body.querySelectorAll('[data-go-rel]').forEach(b=>b.onclick=()=>{document.getElementById('views').hidden=true;setFocus(b.dataset.goRel)})}
document.getElementById('views-open').onclick=()=>openViews();

// search
const q=document.getElementById('q'),res=document.getElementById('results');
